<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive World and Country States Map</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow" id="eyebrowText">WORLD MAP</p>
        <h1 id="mapTitleHeading">World Map</h1>
        <p class="subtitle" id="subtitleText">Click any country to zoom in and explore its states and provinces.</p>
      </div>

      <div class="header-actions">
        <button id="backButton" class="secondary-button hidden" type="button">
          Back to World Map
        </button>
        <button id="printButton" class="print-button" type="button">
          Print Map
        </button>
      </div>
    </header>

    <section class="map-card" aria-label="Map view">
      <div id="loadingMessage" class="loading-message">Loading world map...</div>

      <svg
        id="worldMap"
        viewBox="0 0 1600 900"
        role="img"
        aria-labelledby="mapTitleSvg mapDescription"
      >
        <title id="mapTitleSvg">Interactive world and country map</title>
        <desc id="mapDescription">
          A world map where clicking a country zooms in to show its internal states and provinces.
        </desc>
      </svg>
    </section>

    <p class="screen-note" id="screenNote">
      Tip: click any country to view its states. Use the back button to return to the global view.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="app.js"></script>
</body>
</html>
