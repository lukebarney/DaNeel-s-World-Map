<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Printable World Map</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">PRINTABLE MAP</p>
        <h1>World Map</h1>
        <p class="subtitle">Countries are color-coded and labeled for easy printing.</p>
      </div>

      <button id="printButton" class="print-button" type="button">
        Print World Map
      </button>
    </header>

    <section class="map-card" aria-label="World map">
      <div id="loadingMessage" class="loading-message">Loading world map…</div>

      <svg
        id="worldMap"
        viewBox="0 0 1600 900"
        role="img"
        aria-labelledby="mapTitle mapDescription"
      >
        <title id="mapTitle">World map with labeled countries</title>
        <desc id="mapDescription">
          A printable world map showing countries in different colors with country names.
        </desc>
      </svg>
    </section>

    <p class="screen-note">
      Tip: in your browser print dialog, choose Landscape orientation and enable background graphics.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="app.js"></script>
</body>
</html>
